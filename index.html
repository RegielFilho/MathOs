<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathOS // Next-Gen Math Operating System</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030712">
    <!-- Fontes & Ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/glass.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
    <div id="particles-bg"></div>
    <div class="app-glow-top"></div>

    <div class="app-container">
        <!-- Sidebar Cyberpunk -->
        <aside class="sidebar glass-panel">
            <div class="brand">
                <div class="brand-logo">
                    <span class="logo-core">M</span>
                    <div class="logo-ring"></div>
                </div>
                <div class="brand-text">
                    <h1>Math<span class="text-cyan">OS</span></h1>
                    <span class="version">v2.5.0-PROD</span>
                </div>
            </div>

            <!-- Widget Mentor Astra -->
            <div class="astra-widget glass-card" id="astra-sidebar">
                <div class="astra-avatar-container">
                    <div class="astra-avatar" id="astra-avatar">
                        <div class="astra-eye left"></div>
                        <div class="astra-eye right"></div>
                    </div>
                    <div class="astra-status-online"></div>
                </div>
                <div class="astra-info">
                    <span class="astra-name">ASTRA // MENTOR AI</span>
                    <div class="astra-speech-bubble" id="astra-message">
                        Sistemas prontos. Inicializando sequência de estudos...
                    </div>
                </div>
            </div>

            <nav class="nav-menu">
                <button class="nav-btn active" data-tab="dashboard">
                    <i data-lucide="layout-dashboard"></i> <span>Dashboard</span>
                </button>
                <button class="nav-btn" data-tab="books">
                    <i data-lucide="book-open"></i> <span>Trilha e Livros</span>
                </button>
                <button class="nav-btn" data-tab="timer">
                    <i data-lucide="timer"></i> <span>Cronômetro Pomodoro</span>
                </button>
                <button class="nav-btn" data-tab="stats">
                    <i data-lucide="line-chart"></i> <span>Estatísticas & Heatmap</span>
                </button>
                <button class="nav-btn" data-tab="ai-tutor">
                    <i data-lucide="bot"></i> <span>Astra IA Tutor</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <div class="streak-badge glass-card">
                    <i data-lucide="flame" class="icon-flame"></i>
                    <div>
                        <span class="streak-count" id="sidebar-streak">0</span>
                        <span class="streak-label">DIAS SEGUIDOS</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Área de Conteúdo Principal -->
        <main class="content-area">
            <!-- Header de Status -->
            <header class="top-header glass-panel">
                <div class="user-rank-container">
                    <div class="rank-icon-frame" id="rank-icon-frame">
                        <i data-lucide="shield" id="rank-icon"></i>
                    </div>
                    <div>
                        <span class="rank-title" id="rank-title">Iniciante</span>
                        <div class="user-level">Nível <span id="user-level-val">1</span></div>
                    </div>
                </div>

                <div class="xp-progress-wrapper">
                    <div class="xp-text-info">
                        <span>XP PROGRESS</span>
                        <span><strong id="xp-current">0</strong> / <span id="xp-next">100</span> XP</span>
                    </div>
                    <div class="progress-bar-track">
                        <div class="progress-bar-fill" id="xp-bar-fill" style="width: 0%"></div>
                    </div>
                </div>
            </header>

            <!-- Telas das Abas -->
            <div class="tab-content" id="tab-dashboard"></div>
            <div class="tab-content hidden" id="tab-books"></div>
            <div class="tab-content hidden" id="tab-timer"></div>
            <div class="tab-content hidden" id="tab-stats"></div>
            <div class="tab-content hidden" id="tab-ai-tutor"></div>
        </main>
    </div>

    <script src="src/app.js" type="module"></script>
</body>
</html>
